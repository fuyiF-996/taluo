<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 塔罗日历 · cabbage</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; max-width:600px; margin:16px auto; }
    .cal-head { text-align:center; font-size:0.75rem; color:var(--gold); padding:8px 0; }
    .cal-cell { aspect-ratio:1; border-radius:8px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:0.8rem; color:var(--text-white); cursor:pointer; transition:all .15s; position:relative; }
    .cal-cell:hover { background:rgba(212,175,55,0.12); border-color:rgba(212,175,55,0.4); }
    .cal-cell.has-draw { background:rgba(212,175,55,0.18); border-color:rgba(212,175,55,0.5); }
    .cal-cell.today { box-shadow:0 0 0 2px var(--gold); }
    .cal-cell.empty { background:transparent; border:none; pointer-events:none; }
    .cal-cell .cnt { font-size:0.7rem; color:var(--gold); margin-top:2px; }
    .cal-nav { display:flex; justify-content:center; gap:12px; margin:12px; }
    .cal-nav button { padding:8px 16px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:14px; color:var(--text-white); cursor:pointer; }
    .cal-nav button:hover { background:rgba(212,175,55,0.2); }
    .cal-month-title { text-align:center; font-size:1.2rem; color:var(--gold); font-family:serif; margin:14px 0 6px; }
    .day-detail { max-width:500px; margin:16px auto; padding:14px; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 style="font-size:1.4rem;">📅 塔罗日历</h1>
      <div class="divider"></div>
    </header>

    <div class="cal-nav">
      <button id="cal-prev">← 上月</button>
      <span id="cal-month-title" class="cal-month-title"></span>
      <button id="cal-next">下月 →</button>
      <button id="cal-today" style="background:var(--gold);color:#1a0d3d;border-color:transparent;font-weight:bold;">今天</button>
    </div>

    <div id="cal-grid" class="cal-grid"></div>
    <div id="day-detail" class="glass-card day-detail" style="display:none;"></div>

    <footer style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.8rem;">
      <a href="index" style="color:var(--gold);text-decoration:none;">← 返回占卜首页</a>
      <span style="margin:0 10px;">|</span>
      <a href="stats" style="color:var(--gold);text-decoration:none;">📊 数据看板</a>
    </footer>
  </div>

  <script>
    let viewDate = new Date();
    const WEEK = ['日','一','二','三','四','五','六'];

    function getHistory() {
      try { return JSON.parse(localStorage.getItem("tarot_history") || "[]"); }
      catch { return []; }
    }

    function getDayKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function render() {
      const y = viewDate.getFullYear(), m = viewDate.getMonth();
      document.getElementById('cal-month-title').textContent = `${y}年 ${m+1}月`;
      const grid = document.getElementById('cal-grid');
      grid.innerHTML = WEEK.map(w => `<div class="cal-head">${w}</div>`).join('');

      const first = new Date(y, m, 1);
      const startDow = first.getDay();
      const daysInMonth = new Date(y, m+1, 0).getDate();
      const today = getDayKey(new Date());
      const hist = getHistory();
      const byDay = {};
      hist.forEach(h => {
        const k = getDayKey(new Date(h.timestamp));
        (byDay[k] = byDay[k] || []).push(h);
      });

      // 空白天前
      for (let i = 0; i < startDow; i++) { grid.innerHTML += `<div class="cal-cell empty"></div>`; }
      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const cnt = byDay[key]?.length || 0;
        const cls = ['cal-cell'];
        if (cnt > 0) cls.push('has-draw');
        if (key === today) cls.push('today');
        grid.innerHTML += `<div class="${cls.join(' ')}" data-day="${key}">
          <div>${d}</div>
          ${cnt > 0 ? `<div class="cnt">${cnt}次</div>` : ''}
        </div>`;
      }

      // 点击某天显示详情
      grid.querySelectorAll('[data-day]').forEach(cell => {
        cell.addEventListener('click', () => {
          const key = cell.dataset.day;
          const items = byDay[key] || [];
          const detail = document.getElementById('day-detail');
          detail.style.display = '';
          if (items.length === 0) {
            detail.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:30px;">${key} 没有占卜记录</div>`;
          } else {
            detail.innerHTML = `<div style="font-size:0.9rem;color:var(--gold);margin-bottom:12px;">${key} · 共 ${items.length} 次抽牌</div>` +
              items.map(h => {
                const t = new Date(h.timestamp);
                const labelMap = { single: "单牌", three: "三牌", yesno: "是/否", relationship: "关系", monthly: "月运", yearly: "年运" };
                return `<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.82rem;">
                  <span style="color:var(--gold);font-size:0.72rem;">${t.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})}</span>
                  <span style="color:var(--purple-light);margin:0 6px;">${labelMap[h.spreadName || h.spread] || h.spread}</span>
                  <span style="color:var(--text-white);">${(h.cards || []).map(c => c.name).join(' / ')}</span>
                  ${h.question ? `<div style="color:var(--text-muted);font-size:0.75rem;margin-top:2px;">💭 ${h.question}</div>` : ''}
                </div>`;
              }).join('');
          }
          detail.scrollIntoView({ behavior: 'smooth' });
        });
      });
    }

    document.getElementById('cal-prev').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth()-1); render(); });
    document.getElementById('cal-next').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth()+1); render(); });
    document.getElementById('cal-today').addEventListener('click', () => { viewDate = new Date(); render(); });

    render();
  </script>
</body>
</html>
